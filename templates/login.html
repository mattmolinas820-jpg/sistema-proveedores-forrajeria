{% extends 'base.html' %}
{% block title %}Ingresar | Forrajería{% endblock %}
{% block content %}
<div class="mx-auto mt-8 max-w-md">
    <section class="rounded-2xl border border-slate-200/80 bg-white p-7 sm:p-8">
        <div class="mb-6 text-center">
            <span class="metric-icon mx-auto">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" class="h-5 w-5"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2Zm2-10V7a4 4 0 1 1 8 0v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <p class="page-kicker mt-4 text-xs font-bold uppercase tracking-[.18em]">Acceso privado</p>
            <h1 class="page-title mt-2 text-2xl font-bold text-slate-950">Ingresar al sistema</h1>
            <p class="mt-2 text-sm text-slate-500">Usá las credenciales de administración.</p>
        </div>
        <form method="post" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="block text-sm font-medium text-slate-700">Usuario
                <input name="username" autocomplete="username" required autofocus class="mt-1.5 w-full rounded-xl border border-slate-300 px-3 py-2.5">
            </label>
            <label class="block text-sm font-medium text-slate-700">Contraseña
                <input type="password" name="password" autocomplete="current-password" required class="mt-1.5 w-full rounded-xl border border-slate-300 px-3 py-2.5">
            </label>
            <button class="primary-action w-full rounded-xl px-4 py-2.5 font-semibold text-white">Ingresar</button>
        </form>
    </section>
</div>
{% endblock %}
