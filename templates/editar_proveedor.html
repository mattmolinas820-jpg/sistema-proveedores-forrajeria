{% extends 'base.html' %}
{% block title %}Editar proveedor | Forrajería{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
    <a href="{{ url_for('listar_proveedores') }}" class="text-sm font-semibold text-sky-800 hover:underline">&larr; Volver a proveedores</a>
    <section class="mt-4 rounded-2xl border border-slate-200/80 bg-white p-6">
        <p class="page-kicker text-xs font-bold uppercase tracking-[.18em]">Ficha de proveedor</p>
        <h1 class="page-title mt-2 text-2xl font-bold text-slate-950">Editar datos</h1>
        <form method="post" class="mt-6 grid gap-4 sm:grid-cols-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="text-sm font-medium text-slate-700 sm:col-span-2">Razón social
                <input name="razon_social" value="{{ proveedor.razon_social }}" maxlength="150" required class="mt-1.5 w-full rounded-lg border border-slate-300 px-3 py-2">
            </label>
            <label class="text-sm font-medium text-slate-700">CUIT / CUIL
                <input name="cuit_cuil" value="{{ proveedor.cuit_cuil }}" inputmode="numeric" maxlength="13" required class="mt-1.5 w-full rounded-lg border border-slate-300 px-3 py-2">
            </label>
            <label class="text-sm font-medium text-slate-700">Teléfono
                <input name="telefono" value="{{ proveedor.telefono }}" maxlength="50" class="mt-1.5 w-full rounded-lg border border-slate-300 px-3 py-2">
            </label>
            <label class="text-sm font-medium text-slate-700 sm:col-span-2">Correo electrónico
                <input type="email" name="email" value="{{ proveedor.email }}" maxlength="100" class="mt-1.5 w-full rounded-lg border border-slate-300 px-3 py-2">
            </label>
            <div class="flex justify-end gap-3 sm:col-span-2">
                <a href="{{ url_for('listar_proveedores') }}" class="rounded-lg bg-slate-100 px-4 py-2.5 text-sm font-semibold text-slate-700">Cancelar</a>
                <button class="primary-action rounded-xl px-4 py-2.5 text-sm font-semibold text-white">Guardar cambios</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
